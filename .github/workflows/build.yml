name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周检查一次：nixpkgs 各分支的变化会不会让本仓库求值失败
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flake-check:
    name: flake check (x86_64-linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # checks 里的 NixOS 虚拟机测试需要 /dev/kvm，runner 默认只允许 root 访问
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            system-features = nixos-test benchmark big-parallel kvm
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: nix flake check
        run: nix flake check -L

  nur-eval:
    name: NUR eval (${{ matrix.channel }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [nixos-26.05, nixos-unstable, nixpkgs-unstable]
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=https://github.com/NixOS/nixpkgs/archive/refs/heads/${{ matrix.channel }}.tar.gz

      # 与 NUR 收录时的检查方式一致：限制求值、不依赖 flake
      - name: Evaluate like NUR
        run: |
          nix-env -f . -qa '*' --meta --xml \
            --option restrict-eval true \
            --option allow-import-from-derivation true \
            --drv-path --show-trace \
            -I nixpkgs="$(nix-instantiate --find-file nixpkgs)" \
            -I "$PWD" > /dev/null
